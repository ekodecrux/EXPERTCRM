<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#6366f1" stroke-width="3" stroke-opacity="0.3" />

  <!-- Phone / Headset Telephony Badge Group -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Shield / Card base -->
    <rect x="0" y="0" width="300" height="300" rx="64" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" />
    
    <!-- Phone handset symbol -->
    <path d="M78 82 C78 68 89 57 103 57 L132 57 C144 57 154 66 156 78 L163 116 C165 127 158 138 148 143 L134 150 C146 177 167 198 194 210 L201 196 C206 186 217 179 228 181 L266 188 C278 190 287 200 287 212 L287 241 C287 255 276 266 262 266 C160 266 78 184 78 82 Z" fill="#ffffff" />
    
    <!-- Signal waves -->
    <path d="M210 70 A60 60 0 0 1 250 110" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" />
    <path d="M230 45 A95 95 0 0 1 285 100" fill="none" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" stroke-opacity="0.7" />
  </g>

  <!-- Bottom App Badge Text: EXPERT CALL AGENT -->
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="4" text-anchor="middle">EXPERT CRM</text>
</svg>
